name: meetingos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  mysql:
    image: mysql:8.4
    container_name: meetingos-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meetingos}
      MYSQL_USER: ${MYSQL_USER:-meetingos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TDUCK_MYSQL_DATABASE: ${TDUCK_MYSQL_DATABASE:-tduck}
      TDUCK_MYSQL_USER: ${TDUCK_MYSQL_USER:-tduck}
      TDUCK_MYSQL_PASSWORD: ${TDUCK_MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --mysql-native-password=ON
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2g}
    cpus: ${MYSQL_CPU_LIMIT:-2.0}
    pids_limit: ${MYSQL_PIDS_LIMIT:-512}
    logging: *default-logging

  redis:
    image: redis:7.2-alpine
    container_name: meetingos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.75}
    pids_limit: ${REDIS_PIDS_LIMIT:-256}
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: meetingos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${MINIO_MEMORY_LIMIT:-1g}
    cpus: ${MINIO_CPU_LIMIT:-1.0}
    pids_limit: ${MINIO_PIDS_LIMIT:-256}
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: meetingos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
       mc mb --ignore-existing local/$${MINIO_BUCKET:-meetingos} &&
       mc anonymous set none local/$${MINIO_BUCKET:-meetingos}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-meetingos}
    restart: "no"
    mem_limit: ${INIT_MEMORY_LIMIT:-256m}
    cpus: ${INIT_CPU_LIMIT:-0.5}
    pids_limit: ${INIT_PIDS_LIMIT:-128}
    logging: *default-logging

  # 旧版本后端以 root 运行，已有上传卷可能仍由 root 持有。该一次性任务只修复卷属主，
  # 随后真正承载业务流量的 meetingos-backend 始终以 UID/GID 10001 运行。
  meetingos-upload-init:
    image: ${MEETINGOS_BACKEND_IMAGE:?Set MEETINGOS_BACKEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-upload-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ ! -f /app/uploads/.meetingos-owned-by-10001 ]; then
          chown -R 10001:10001 /app/uploads &&
          touch /app/uploads/.meetingos-owned-by-10001 &&
          chown 10001:10001 /app/uploads/.meetingos-owned-by-10001;
        fi
    volumes:
      - meetingos-upload-data:/app/uploads
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    mem_limit: ${INIT_MEMORY_LIMIT:-256m}
    cpus: ${INIT_CPU_LIMIT:-0.5}
    pids_limit: ${INIT_PIDS_LIMIT:-128}
    logging: *default-logging

  meetingos-backend:
    image: ${MEETINGOS_BACKEND_IMAGE:?Set MEETINGOS_BACKEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meetingos-upload-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${BACKEND_SERVER_PORT:-8080}
      JAVA_OPTS: ${JAVA_OPTS:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_REDIS_URL: ${SPRING_REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-meetingos}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MEETINGOS_SECURITY_ACCESS_TOKEN_MINUTES: ${MEETINGOS_SECURITY_ACCESS_TOKEN_MINUTES:-720}
      MEETINGOS_SECURITY_SECURE_COOKIES: ${MEETINGOS_SECURITY_SECURE_COOKIES:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      MEETINGOS_PUBLIC_BASE_URL: ${MEETINGOS_PUBLIC_BASE_URL:-${PUBLIC_BASE_URL}}
      MEETINGOS_UPLOAD_DIR: ${MEETINGOS_UPLOAD_DIR:-/app/uploads}
      TDUCK_PUBLIC_URL: ${TDUCK_PUBLIC_URL}
      TDUCK_API_PUBLIC_URL: ${TDUCK_API_PUBLIC_URL}
      TDUCK_ADMIN_API_URL: ${TDUCK_ADMIN_API_URL:-${TDUCK_API_PUBLIC_URL}}
      TDUCK_ADMIN_EMAIL: ${TDUCK_ADMIN_EMAIL:-}
      TDUCK_ADMIN_PASSWORD: ${TDUCK_ADMIN_PASSWORD:-}
      TDUCK_WEBHOOK_TOKEN: ${TDUCK_WEBHOOK_TOKEN}
      MEETINGOS_WEBHOOK_INTERNAL_URL: ${MEETINGOS_WEBHOOK_INTERNAL_URL:-}
      MEETINGOS_INIT_ADMIN_USERNAME: ${MEETINGOS_INIT_ADMIN_USERNAME:-admin}
      MEETINGOS_INIT_ADMIN_PASSWORD: ${MEETINGOS_INIT_ADMIN_PASSWORD}
      MEETINGOS_INIT_ADMIN_EMAIL: ${MEETINGOS_INIT_ADMIN_EMAIL:-admin@example.com}
      PUBLIC_QUERY_RATE_LIMIT_PER_MINUTE: ${PUBLIC_QUERY_RATE_LIMIT_PER_MINUTE:-30}
      PUBLIC_QUERY_CAPTCHA_ENABLED: ${PUBLIC_QUERY_CAPTCHA_ENABLED:-false}
      PUBLIC_QUERY_CAPTCHA_TTL_SECONDS: ${PUBLIC_QUERY_CAPTCHA_TTL_SECONDS:-300}
      # 后端不发布宿主机端口，只接受内部边界 Nginx 的流量；Nginx 会覆盖客户端伪造的转发头。
      PUBLIC_QUERY_TRUST_FORWARD_HEADERS: ${PUBLIC_QUERY_TRUST_FORWARD_HEADERS:-true}
    expose:
      - "8080"
    volumes:
      - meetingos-upload-data:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: ${MEETINGOS_BACKEND_MEMORY_LIMIT:-1536m}
    cpus: ${MEETINGOS_BACKEND_CPU_LIMIT:-2.0}
    pids_limit: ${MEETINGOS_BACKEND_PIDS_LIMIT:-256}
    logging: *default-logging

  meetingos-frontend:
    image: ${MEETINGOS_FRONTEND_IMAGE:?Set MEETINGOS_FRONTEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-frontend
    restart: unless-stopped
    depends_on:
      meetingos-backend:
        condition: service_healthy
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 官方 nginx 镜像启动时会调整缓存目录属主，并切换 worker 用户。
      # 如果仅保留 NET_BIND_SERVICE，重建容器后会因 chown 权限不足反复重启。
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: ${MEETINGOS_FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${MEETINGOS_FRONTEND_CPU_LIMIT:-0.5}
    pids_limit: ${MEETINGOS_FRONTEND_PIDS_LIMIT:-128}
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: meetingos-nginx
    restart: unless-stopped
    depends_on:
      meetingos-frontend:
        condition: service_healthy
      meetingos-backend:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/meetingos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}
    cpus: ${NGINX_CPU_LIMIT:-1.0}
    pids_limit: ${NGINX_PIDS_LIMIT:-256}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # TDuck optional profile
  # ---------------------------------------------------------------------------
  # 启动方式：
  #   ./scripts/deploy.sh ../.env --profile tduck up -d
  #
  # 重要：TDuck 社区版默认管理员账号/密码通常是：
  #   admin@tduckcloud.com / 123456
  # 生产上线前必须登录 TDuck 后台修改密码，并配置强密码、访问控制和备份。
  tduck-backend:
    profiles: ["tduck"]
    image: ${TDUCK_BACKEND_IMAGE:?Set TDUCK_BACKEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-tduck-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${TDUCK_JAVA_OPTS:--Duser.language=zh -XX:+UseG1GC}
      # TDuck 官方镜像入口是 `java -jar application.jar`，不会主动展开 JAVA_OPTS。
      # JAVA_TOOL_OPTIONS 会被 JVM 自动读取，用于在不改 vendor 镜像入口的情况下限制内存。
      JAVA_TOOL_OPTIONS: ${TDUCK_JAVA_TOOL_OPTIONS:--Duser.language=zh -Duser.timezone=Asia/Shanghai -XX:+UseG1GC -Xms256m -Xmx768m}
      # TDuck 后端是 Spring Boot 2.x，使用 relaxed binding 覆盖 application-prod.yml。
      # 当前版本只强依赖 MySQL；Redis 主要供 TDuck 使用，MeetingOS 仅保留多副本限流预留配置。
      spring.datasource.url: jdbc:mysql://mysql:3306/${TDUCK_MYSQL_DATABASE:-tduck}?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&tinyInt1isBit=false&allowPublicKeyRetrieval=true
      spring.datasource.username: ${TDUCK_MYSQL_USER:-tduck}
      spring.datasource.password: ${TDUCK_MYSQL_PASSWORD}
      SERVER_PORT: 8999
    volumes:
      - tduck-upload-data:/application/BOOT-INF/lib/upload
    expose:
      - "8999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # 当前官方镜像的根路径返回 200；doc.html 和 actuator 均未开放，不能用于健康判定。
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8999/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: ${TDUCK_BACKEND_MEMORY_LIMIT:-1280m}
    cpus: ${TDUCK_BACKEND_CPU_LIMIT:-1.5}
    pids_limit: ${TDUCK_BACKEND_PIDS_LIMIT:-256}
    logging: *default-logging

  tduck-frontend:
    profiles: ["tduck"]
    image: ${TDUCK_FRONTEND_IMAGE:?Set TDUCK_FRONTEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-tduck-frontend
    restart: unless-stopped
    depends_on:
      tduck-backend:
        condition: service_healthy
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 官方 nginx 镜像启动时会调整缓存目录属主，并切换 worker 用户。
      # TDuck 前端同样使用 nginx 镜像，权限需要和 MeetingOS 前端保持一致。
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: ${TDUCK_FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${TDUCK_FRONTEND_CPU_LIMIT:-0.5}
    pids_limit: ${TDUCK_FRONTEND_PIDS_LIMIT:-128}
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  minio-data:
  nginx-logs:
  meetingos-upload-data:
  tduck-upload-data:
