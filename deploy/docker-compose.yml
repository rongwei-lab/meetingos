name: meetingos

services:
  mysql:
    image: mysql:8.4
    container_name: meetingos-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meetingos}
      MYSQL_USER: ${MYSQL_USER:-meetingos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TDUCK_MYSQL_DATABASE: ${TDUCK_MYSQL_DATABASE:-tduck}
      TDUCK_MYSQL_USER: ${TDUCK_MYSQL_USER:-tduck}
      TDUCK_MYSQL_PASSWORD: ${TDUCK_MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --mysql-native-password=ON
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: meetingos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: meetingos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: meetingos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
       mc mb --ignore-existing local/$${MINIO_BUCKET:-meetingos} &&
       mc anonymous set none local/$${MINIO_BUCKET:-meetingos}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-meetingos}
    restart: "no"

  meetingos-backend:
    image: ${MEETINGOS_BACKEND_IMAGE:?Set MEETINGOS_BACKEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${BACKEND_SERVER_PORT:-8080}
      JAVA_OPTS: ${JAVA_OPTS:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_REDIS_URL: ${SPRING_REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-meetingos}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MEETINGOS_SECURITY_ACCESS_TOKEN_MINUTES: ${MEETINGOS_SECURITY_ACCESS_TOKEN_MINUTES:-720}
      MEETINGOS_SECURITY_SECURE_COOKIES: ${MEETINGOS_SECURITY_SECURE_COOKIES:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      MEETINGOS_PUBLIC_BASE_URL: ${MEETINGOS_PUBLIC_BASE_URL:-${PUBLIC_BASE_URL}}
      MEETINGOS_UPLOAD_DIR: ${MEETINGOS_UPLOAD_DIR:-/app/uploads}
      TDUCK_PUBLIC_URL: ${TDUCK_PUBLIC_URL}
      TDUCK_API_PUBLIC_URL: ${TDUCK_API_PUBLIC_URL}
      TDUCK_ADMIN_API_URL: ${TDUCK_ADMIN_API_URL:-${TDUCK_API_PUBLIC_URL}}
      TDUCK_ADMIN_EMAIL: ${TDUCK_ADMIN_EMAIL:-}
      TDUCK_ADMIN_PASSWORD: ${TDUCK_ADMIN_PASSWORD:-}
      TDUCK_WEBHOOK_TOKEN: ${TDUCK_WEBHOOK_TOKEN}
      MEETINGOS_WEBHOOK_INTERNAL_URL: ${MEETINGOS_WEBHOOK_INTERNAL_URL:-}
      MEETINGOS_INIT_ADMIN_USERNAME: ${MEETINGOS_INIT_ADMIN_USERNAME:-admin}
      MEETINGOS_INIT_ADMIN_PASSWORD: ${MEETINGOS_INIT_ADMIN_PASSWORD}
      MEETINGOS_INIT_ADMIN_EMAIL: ${MEETINGOS_INIT_ADMIN_EMAIL:-admin@example.com}
      PUBLIC_QUERY_RATE_LIMIT_PER_MINUTE: ${PUBLIC_QUERY_RATE_LIMIT_PER_MINUTE:-30}
      PUBLIC_QUERY_CAPTCHA_ENABLED: ${PUBLIC_QUERY_CAPTCHA_ENABLED:-false}
      PUBLIC_QUERY_CAPTCHA_TTL_SECONDS: ${PUBLIC_QUERY_CAPTCHA_TTL_SECONDS:-300}
      PUBLIC_QUERY_TRUST_FORWARD_HEADERS: ${PUBLIC_QUERY_TRUST_FORWARD_HEADERS:-false}
    expose:
      - "8080"
    volumes:
      - meetingos-upload-data:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  meetingos-frontend:
    image: ${MEETINGOS_FRONTEND_IMAGE:?Set MEETINGOS_FRONTEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-frontend
    restart: unless-stopped
    depends_on:
      meetingos-backend:
        condition: service_started
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 官方 nginx 镜像启动时会调整缓存目录属主，并切换 worker 用户。
      # 如果仅保留 NET_BIND_SERVICE，重建容器后会因 chown 权限不足反复重启。
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  nginx:
    image: nginx:1.27-alpine
    container_name: meetingos-nginx
    restart: unless-stopped
    depends_on:
      meetingos-frontend:
        condition: service_started
      meetingos-backend:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/meetingos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  # ---------------------------------------------------------------------------
  # TDuck optional profile
  # ---------------------------------------------------------------------------
  # 启动方式：
  #   docker compose --profile tduck up -d
  #
  # 重要：TDuck 社区版默认管理员账号/密码通常是：
  #   admin@tduckcloud.com / 123456
  # 生产上线前必须登录 TDuck 后台修改密码，并配置强密码、访问控制和备份。
  tduck-backend:
    profiles: ["tduck"]
    image: ${TDUCK_BACKEND_IMAGE:?Set TDUCK_BACKEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-tduck-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${TDUCK_JAVA_OPTS:--Duser.language=zh -XX:+UseG1GC}
      # TDuck 后端是 Spring Boot 2.x，使用 relaxed binding 覆盖 application-prod.yml。
      # 当前版本只强依赖 MySQL；Redis 主要供 TDuck 使用，MeetingOS 仅保留多副本限流预留配置。
      spring.datasource.url: jdbc:mysql://mysql:3306/${TDUCK_MYSQL_DATABASE:-tduck}?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&tinyInt1isBit=false&allowPublicKeyRetrieval=true
      spring.datasource.username: ${TDUCK_MYSQL_USER:-tduck}
      spring.datasource.password: ${TDUCK_MYSQL_PASSWORD}
      SERVER_PORT: 8999
    volumes:
      - tduck-upload-data:/application/BOOT-INF/lib/upload
    expose:
      - "8999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  tduck-frontend:
    profiles: ["tduck"]
    image: ${TDUCK_FRONTEND_IMAGE:?Set TDUCK_FRONTEND_IMAGE to a versioned tag or digest}
    container_name: meetingos-tduck-frontend
    restart: unless-stopped
    depends_on:
      tduck-backend:
        condition: service_started
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  mysql-data:
  redis-data:
  minio-data:
  nginx-logs:
  meetingos-upload-data:
  tduck-upload-data:
