# MeetingOS MVP reverse proxy.
# 生产环境请补充真实证书、HSTS、访问日志脱敏和 WAF/限流策略。

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    server_name _;

    # Docker 内置 DNS。使用变量延迟解析，避免语法检查或可选 TDuck 未启动时 Nginx 直接失败。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $meetingos_backend_url http://meetingos-backend:8080;
    set $meetingos_frontend_url http://meetingos-frontend:80;
    set $tduck_backend_url http://tduck-backend:8999;
    set $tduck_frontend_url http://tduck-frontend:80;

    client_max_body_size 50m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json text/csv image/svg+xml;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 宿主机/负载均衡健康检查入口。
    # 后端已经放行 /actuator/health，这里单独代理，避免被 SPA 前端兜底路由接管。
    location = /actuator/health {
        proxy_pass $meetingos_backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MeetingOS 后端 API。
    # 后端控制器本身使用 /api/admin、/api/public 等前缀，因此这里必须原样转发 /api。
    location /api/ {
        proxy_pass $meetingos_backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # MeetingOS 后台上传的公开图片资源，例如公开查询页 Logo 和背景图。
    location /uploads/ {
        proxy_pass $meetingos_backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # TDuck 后端 API。
    # TDuck 前端生产环境建议配置同域 /tduck-api，避免跨域和 Cookie 域问题。
    location /tduck-api/ {
        rewrite ^/tduck-api/?(.*)$ /$1 break;
        proxy_pass $tduck_backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tduck-api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # TDuck 本地文件存储公开资源。
    # TDuck 上传分享图、主题图、表单附件时默认返回 /u/{userMd5}/{file}；
    # 如果不转发到 TDuck 后端，会被 MeetingOS SPA 兜底为 index.html，图片组件就显示“加载失败”。
    location ^~ /u/ {
        proxy_pass $tduck_backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TDuck 前端。
    # 对外路径为 /tduck/，表单填写页示例：
    #   /tduck/s/{formKey}
    # 若 TDuck 前端构建产物没有 base=/tduck/，需要在 tduck-front 构建时调整 publicPath。
    location = /tduck {
        return 301 /tduck/;
    }

    # TDuck 富文本编辑器依赖包内部仍会以站点根路径加载 /tinymce/*。
    # 如果不单独转发，这些请求会被 MeetingOS 前端 SPA 兜底为 index.html，
    # 导致 TinyMCE 脚本解析失败并一直显示“富文本资源加载中...”。
    location ^~ /tinymce/ {
        proxy_pass $tduck_frontend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tduck/ {
        rewrite ^/tduck/?(.*)$ /$1 break;
        proxy_pass $tduck_frontend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容历史误生成或人工复制的 TDuck 裸表单地址：
    #   /s/{formKey}
    # 标准入口仍是 /tduck/s/{formKey}，这里使用 302 显式跳转，避免被 MeetingOS SPA 兜底接管。
    location ^~ /s/ {
        return 302 /tduck$request_uri;
    }

    # 报名二维码公开入口：
    #   /r/{meetingCode}
    #
    # 推荐由 MeetingOS 前端先接管该路由，向 /api/public/meetings/{meetingCode}
    # 查询报名状态和 tduck_form_key，再跳转到 /tduck/s/{formKey}。
    # 若后端实现了服务端 302，也可以改为 proxy 到 /api/public/registration/redirect/{meetingCode}。
    location ^~ /r/ {
        proxy_pass $meetingos_frontend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MeetingOS 前端 SPA。
    # 座位查询、房间查询、签到结果等公开页也由同一前端承载，再调用 /api/public/*。
    location / {
        proxy_pass $meetingos_frontend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
