spring:
  datasource:
    url: jdbc:h2:mem:meetingos;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

meetingos:
  security:
    jwt-secret: "test-secret-test-secret-test-secret-123456"
    jwt-issuer: "meetingos-test"
    access-token-minutes: 60
    secure-cookies: false
  tduck:
    webhook-secret: "test-webhook-secret"
    public-base-url: "http://tduck.test"
    api-base-url: "http://tduck-api.test"
    admin-api-base-url: "http://tduck-api.test"
    admin-email: ""
    admin-password: ""
    connect-timeout: 100ms
    read-timeout: 200ms
    api-token: ""
    sync-api-url: ""
  public-query:
    trust-forward-headers: false
    history-retention-days: 180
    history-cleanup-batch-size: 1000
    history-cleanup-max-batches: 10
  invitation:
    tracking-secret: "test-invitation-tracking-secret-at-least-32-bytes"
    event-retention-days: 180
    amap-key: "test-amap-key"
  operation-log:
    retention-days: 90
